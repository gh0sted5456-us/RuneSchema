site_name: RuneSchema
site_description: "Authoring and runtime reference for RuneSchema, a UE4SS content runtime for RuneScape: Dragonwilds."
site_url: https://gh0sted5456-us.github.io/RuneSchema/
repo_url: https://github.com/gh0sted5456-us/RuneSchema
repo_name: gh0sted5456-us/RuneSchema
# Internal engineering notes live in source control, not in the public site or search.
exclude_docs: |
  /development/
  /examples/RSv16/
  /examples/GreatTree/
  /QUEST-SCROLL-IDENTITY-DIAGNOSTIC.md
  /ALPHA-CANDIDATE.md

theme:
  name: material
  language: en
  logo: assets/images/runeschema-helpy.png
  favicon: assets/images/runeschema-helpy.png
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search:
      separator: '[\s._-]+'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gh0sted5456-us/RuneSchema
      name: RuneSchema on GitHub

copyright: >-
  Copyright (c) 2026 RSDW Modding Community · MIT for covered original code and documentation · Upstream rights retained


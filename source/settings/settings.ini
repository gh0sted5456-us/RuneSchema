; RuneSchema settings. For manual edits, close the game and restart afterward.
; Helpy and Mod Menu can apply cleanup scope changes at the next world entry.
; Keys are case-sensitive. Booleans: true/false. Lists: JSON arrays.
; Existing settings.jsonc is translated on first launch and archived on the
; next successful INI launch. Plugin-owned settings remain JSONC.

[RuneSchema]
enableAutoReload = false
; Helpy open/close shortcut. Quick settings can change it immediately.
helpyHotkey = "F2"
; Reuse a validated native reflection mapping; refresh after executable updates.
; Requires UE4SS DumpUSMAP support. Restart after changing this setting.
autoUpdateMappings = true
; ../RuneSchema.log mirrors normal RuneSchema output; UE4SS keeps that output too.
; Advanced logging adds detailed records to RuneSchema.log only.
advancedLogging = false
; Start a fresh continuous RuneSchema.log each launch. No mid-run size rotation.
; When enabled, keep the previous run as logs/RuneSchema-<UTC datetime>.log.
; Archives are retained until you remove them. Restart after changing this setting.
archiveLogs = false
; Write RuneSchema and Helpy diagnostics beside UE4SS.log on the next launch.
; Native game logging still requires -ABSLOG (see Helpy Diagnostics > Options).
logsInUE4SS = false
authoringTools = true
advancedRuntime = false
colorCodeLoaderAnnotations = true
enableExperimentalDropScaling = false

[diagnosticJobs]
enabled = false

[diagnostics]
persistenceLedger = false
; Advisory only: this never limits loading.
largeRecipeWorkloadWarning = true
largeRecipeWarningThreshold = 50000

[bridgeDiagnostics]
verbose = false

[bpModLoader]
luaActorLoader = true
; Leave false for Vortex/hardlink-managed installations.
patchScript = false

[plugins]
compatibilityNotices = "quiet"

[persistence]
characterCustomization = false
allowCorruptCharacterEntry = false
quests = true
; Clean only the selected save at world entry. Blanket cleanup is an opt-in fallback.
blanketCleanup = false
; false: apply scope changes after restarting; true: at the next world entry.
cleanupOnWorldEntry = false

[worldSaveCleanup]
; Applies to Steam/Epic, Game Pass and dedicated servers.
backupBeforePrune = true

[defaultRecovery]
enabled = false
useExternalDefault = false
appearance = true
quests = false
items = false
progress = false

[helpyAuthority]
allowClientItemGrants = false
allowClientTeleport = false
allowPinAccess = false
accessPin = ""
allowClientTemporarySpawns = false
maximumItemCount = 100
maximumSpawnCount = 100
maximumNpcDurationSeconds = 300
permittedPlayerGuids = []
permittedPlayerNames = []

[loadOrder]
enabled = true
autoCreate = true
reconcileFolders = true
preserveComments = true
strictValues = true
deterministicFallback = true

[combatFallback]
enabled = false
additionalWeapons = true
manifestMelee = true
rangedEquipment = true
initialWorldMutation = false

[loaders]
assets = true
blueprints = true
buildings = true
courses = true
dialogue = true
effects = true
enums = true
equipment = true
events = true
journal = true
lore = true
nameplates = true
niagara = true
npc = true
players = true
quests = true
registry = true
raw = true
recipes = true
spawns = true
strings = true
vendors = true

[spawnBehavior]
enableNativeRoaming = true
defaultRoamRadius = 800.0
defaultRoamMaxZTolerance = 200.0

[quickLaunch]
; Startup selection only. Independent of persistence.allowCorruptCharacterEntry.
; Changes apply on the next launch, never travel out of a running world.
enabled = false
characterName = ""
worldName = ""
softLoading = true

[additionalLogging]
; Opt-in metadata in RuneSchema.log. Paths can include personal folder names.
; Region is the Windows setting, not IP/GPS. Rates are observed, not a speed test.
enabled = false
filePaths = false
region = false
networkRates = false
savePaths = false
averageLatency = false

[npcDiagnostics]
statusExport = false
interactionTraceExport = false

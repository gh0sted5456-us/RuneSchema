; RuneSchema settings. Edit with the game closed, then restart.
; Keys are case-sensitive. Booleans: true/false. Lists: JSON arrays.
; Existing settings.jsonc is translated on first launch and archived on the
; next successful INI launch. Plugin-owned settings remain JSONC.

[RuneSchema]
enableAutoReload = false
; Reuse a validated native reflection mapping; refresh after executable updates.
; Requires UE4SS DumpUSMAP support. Restart after changing this setting.
autoUpdateMappings = true
; ../RuneSchema.log mirrors normal RuneSchema output; UE4SS keeps that output too.
; Advanced logging adds detailed records to RuneSchema.log only.
advancedLogging = false
; Start a fresh continuous RuneSchema.log each launch. No mid-run size rotation.
; When enabled, keep the previous run as logs/RuneSchema-<UTC datetime>.log.
; Archives are retained until you remove them. Restart after changing this setting.
archiveLogs = false
authoringTools = true
advancedRuntime = false
colorCodeLoaderAnnotations = true
enableExperimentalDropScaling = false

[diagnosticJobs]
enabled = false

[diagnostics]
persistenceLedger = false
; Advisory only: this never limits loading.
largeRecipeWorkloadWarning = true
largeRecipeWarningThreshold = 50000

[bridgeDiagnostics]
verbose = false

[bpModLoader]
luaActorLoader = true
; Leave false for Vortex/hardlink-managed installations.
patchScript = false

[plugins]
compatibilityNotices = "quiet"

[persistence]
characterCustomization = false
allowCorruptCharacterEntry = false
quests = true

[worldSaveCleanup]
; Applies to Steam/Epic, Game Pass and dedicated servers.
backupBeforePrune = true

[defaultRecovery]
enabled = false
useExternalDefault = false
appearance = true
quests = false
items = false
progress = false

[helpyAuthority]
allowClientItemGrants = false
allowClientTemporarySpawns = false
maximumItemCount = 100
maximumSpawnCount = 100
maximumNpcDurationSeconds = 300
permittedPlayerGuids = []
permittedPlayerNames = []

[loadOrder]
enabled = true
autoCreate = true
reconcileFolders = true
preserveComments = true
strictValues = true
deterministicFallback = true

[combatFallback]
enabled = false
additionalWeapons = true
manifestMelee = true
rangedEquipment = true
initialWorldMutation = false

[loaders]
assets = true
blueprints = true
buildings = true
courses = true
dialogue = true
effects = true
enums = true
equipment = true
events = true
journal = true
lore = true
nameplates = true
niagara = true
npc = true
players = true
quests = true
registry = true
raw = true
recipes = true
spawns = true
strings = true
vendors = true

[spawnBehavior]
enableNativeRoaming = true
defaultRoamRadius = 800.0
defaultRoamMaxZTolerance = 200.0

[npcDiagnostics]
statusExport = false
interactionTraceExport = false

name: Build RuneSchema packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '0.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build RuneSchema
        shell: cmd
        env:
          UEPSEUDO_READ_TOKEN: ${{ secrets.UEPSEUDO_READ_TOKEN }}
        run: call "Build RuneSchema.bat"

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-Core
          path: dist/RuneSchema-*-Core.zip
          if-no-files-found: error

      - name: Upload Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-Universal
          path: dist/RuneSchema-*-Universal.zip
          if-no-files-found: error

      - name: Upload Helpy artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-Helpy
          path: dist/RuneSchema.Helpy-*.zip
          if-no-files-found: warn

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $tagMatch = [regex]::Match($tag, '^v?(\d+\.\d+\.\d+\.\d+[em])$')
          if (-not $tagMatch.Success) {
            throw "Unsupported RuneSchema release tag: $tag"
          }
          $releaseVersion = $tagMatch.Groups[1].Value
          $buildInfo = Get-Content source/raw/include/Utility/BuildInfo.h -Raw
          $versionMatch = [regex]::Match($buildInfo, 'Version\[\] = "([^"]+)";')
          if (-not $versionMatch.Success -or $versionMatch.Groups[1].Value -ne $releaseVersion) {
            throw "Tag $tag does not match the RuneSchema runtime version."
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "RuneSchema $tag" --generate-notes
          }
          Get-ChildItem dist -Filter '*.zip' | ForEach-Object {
            gh release upload $tag $_.FullName --clobber
          }

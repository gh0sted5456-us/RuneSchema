name: Build RuneSchema packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '0.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build RuneSchema
        shell: cmd
        env:
          UEPSEUDO_READ_TOKEN: ${{ secrets.UEPSEUDO_READ_TOKEN }}
        run: call "Build RuneSchema.bat"

      - name: Upload RuneSchema artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema
          path: dist/RuneSchema-*.zip
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $tagMatch = [regex]::Match($tag, '^v?(\d+\.\d+\.\d+\.\d+[em])$')
          if (-not $tagMatch.Success) {
            throw "Unsupported RuneSchema release tag: $tag"
          }
          $releaseVersion = $tagMatch.Groups[1].Value
          $buildInfo = Get-Content source/raw/include/Utility/BuildInfo.h -Raw
          $versionMatch = [regex]::Match($buildInfo, 'Version\[\] = "([^"]+)";')
          if (-not $versionMatch.Success -or $versionMatch.Groups[1].Value -ne $releaseVersion) {
            throw "Tag $tag does not match the RuneSchema runtime version."
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "RuneSchema $tag" --generate-notes
          }
          $package = Join-Path dist "RuneSchema-$releaseVersion.zip"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw "RuneSchema release package not found: $package"
          }
          gh release upload $tag $package --clobber

name: RuneSchema 0.8 test bed

on:
  push:
    branches:
      - RuneSchema-0.8-test-bed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-widget-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout test bed
        uses: actions/checkout@v6

      - name: Fetch JSON headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git .cache/nlohmann-json

      - name: Configure contract tests
        shell: pwsh
        run: cmake -S source/raw/core -B build/cache/contracts-08 -G Ninja -DRUNESCHEMA_JSON_INCLUDE_DIR="$PWD/.cache/nlohmann-json/include" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SUPPRESS_REGENERATION=ON

      - name: Build 0.8 runtime-widget contract
        shell: pwsh
        run: cmake --build build/cache/contracts-08 --target runtime-widget-v08-contract

      - name: Run 0.8 runtime-widget contract
        shell: pwsh
        run: ctest --test-dir build/cache/contracts-08 --output-on-failure -R "^runtime-widget-v08-contract$"

name: RuneSchema 0.8 test bed

on:
  push:
    branches:
      - RuneSchema-0.8-test-bed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-widget-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout test bed
        uses: actions/checkout@v6

      - name: Validate RuneSchema builder syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/build/build.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              $line = $_.Extent.StartLineNumber
              $column = $_.Extent.StartColumnNumber
              Write-Host ("PowerShell parse error at line {0}, column {1}: {2}" -f $line, $column, $_.Message) -ForegroundColor Red
              Write-Host ("  " + $_.Extent.Text) -ForegroundColor DarkYellow
            }
            exit 1
          }

      - name: Fetch JSON headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          $ok = $false
          1..3 | ForEach-Object {
            if ($ok) { return }
            Remove-Item -Recurse -Force .cache/nlohmann-json -ErrorAction SilentlyContinue
            git clone --depth 1 --branch v3.11.3 https://github.com/nlohmann/json.git .cache/nlohmann-json
            if ($LASTEXITCODE -eq 0) {
              $ok = $true
            } else {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $ok) { throw "Could not fetch nlohmann/json after three attempts." }

      - name: Configure contract tests
        shell: pwsh
        run: cmake -S source/raw/core -B build/cache/contracts-08 -G Ninja -DRUNESCHEMA_JSON_INCLUDE_DIR="$PWD/.cache/nlohmann-json/include" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SUPPRESS_REGENERATION=ON

      - name: Build 0.8 contracts
        shell: pwsh
        run: cmake --build build/cache/contracts-08 --target runtime-widget-v08-contract ue4ss-bootstrap-contract load-order-authority-contract plugin-catalog-compatibility

      - name: Run 0.8 contracts
        shell: pwsh
        run: ctest --test-dir build/cache/contracts-08 --output-on-failure -R "^(runtime-widget-v08-contract|ue4ss-bootstrap-contract|load-order-authority-contract|plugin-catalog-compatibility)$"

      - name: Package full 0.8 source tree
        shell: pwsh
        run: |
          $stageRoot = Join-Path $PWD "dist/RuneSchema-0.8-test-bed"
          Remove-Item -Recurse -Force $stageRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stageRoot | Out-Null

          Get-ChildItem -Force $PWD | Where-Object {
            $_.Name -notin @(".git", "dist", ".cache")
          } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $stageRoot -Recurse -Force
          }

          # Keep the full buildable source tree, but never ship machine/CI-specific
          # generated CMake/Ninja state. The recipient must configure locally.
          Remove-Item -Recurse -Force (Join-Path $stageRoot "build/cache") -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $stageRoot "build/logs") -ErrorAction SilentlyContinue

          $required = @(
            (Join-Path $stageRoot "Build RuneSchema.bat"),
            (Join-Path $stageRoot "build/build.ps1"),
            (Join-Path $stageRoot "source/raw/CMakeLists.txt")
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Full source package is missing required compile input: $path"
            }
          }

          Compress-Archive -Path $stageRoot -DestinationPath "dist/RuneSchema-0.8-test-bed-full-source.zip" -Force

      - name: Upload full 0.8 source tree
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-0.8-test-bed-full-source
          path: dist/RuneSchema-0.8-test-bed-full-source.zip
          if-no-files-found: error

      - name: Package 0.8 demo mod
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path source/extras/examples/RuntimeWidget08/RuneSchema08Demo -DestinationPath dist/RuneSchema08Demo.zip -Force

      - name: Upload 0.8 demo mod
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema08Demo
          path: dist/RuneSchema08Demo.zip
          if-no-files-found: error

      - name: Package Gamepass Restore Appearance test
        shell: pwsh
        run: |
          Compress-Archive -Path source/examples/RestoreAppearance -DestinationPath dist/RestoreAppearance-Gamepass-0.8.zip -Force

      - name: Upload Gamepass Restore Appearance test
        uses: actions/upload-artifact@v4
        with:
          name: RestoreAppearance-Gamepass-0.8
          path: dist/RestoreAppearance-Gamepass-0.8.zip
          if-no-files-found: error

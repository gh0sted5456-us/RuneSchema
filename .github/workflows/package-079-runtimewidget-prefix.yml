name: Package RuneSchema 0.7.9 RuntimeWidget prefix fix

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/package-079-runtimewidget-prefix.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: f44a4d910de142646602aa28a5c34ef8b9daf1f8

      - name: Create source ZIP
        shell: bash
        run: |
          zip -r RuneSchema-0.7.9-runtimewidget-prefix-build-ready.zip . -x ".git/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-0.7.9-runtimewidget-prefix-build-ready
          path: RuneSchema-0.7.9-runtimewidget-prefix-build-ready.zip
          if-no-files-found: error

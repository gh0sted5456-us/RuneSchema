name: Package RuneSchema 0.7.9 GamePass consumable fix

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/package-079-gamepass-consumable.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 1d0bed402646d2eea22c8a753dba9968e7384a22

      - name: Create source ZIP
        shell: bash
        run: |
          zip -r RuneSchema-0.7.9-gamepass-consumable-fix.zip . -x ".git/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-0.7.9-gamepass-consumable-fix
          path: RuneSchema-0.7.9-gamepass-consumable-fix.zip
          if-no-files-found: error

name: Package diagnostic RuntimeWidget source

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/package-runtimewidget-diagnostics.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 86bfed180d6c77943a3aaf693a76af87da662e4e

      - name: Create source ZIP
        shell: bash
        run: |
          zip -r RuneSchema-experimental-runtimewidget-diagnostics.zip . -x ".git/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-experimental-runtimewidget-diagnostics
          path: RuneSchema-experimental-runtimewidget-diagnostics.zip
          if-no-files-found: error

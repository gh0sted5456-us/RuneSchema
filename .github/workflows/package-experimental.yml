name: Package experimental snapshot

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/package-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested snapshot
        uses: actions/checkout@v6
        with:
          ref: c2d8f5270e44a5770623e4ad46939d805258a18e

      - name: Create source package
        shell: bash
        run: |
          zip -r RuneSchema-experimental-c2d8f52.zip .             -x ".git/*"                ".github/workflows/package-experimental.yml"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-experimental-c2d8f52
          path: RuneSchema-experimental-c2d8f52.zip
          if-no-files-found: error

name: Deploy RuneSchema documentation

on:
  push:
    branches:
      - main
      - experimental
    paths:
      - 'docs/**'
      - 'source/*.md'
      - 'source/loaders/**'
      - 'source/unreal-runeschema/**'
      - 'source/examples/**'
      - 'source/schemas/**'
      - 'source/raw/BASE-BUILDER-IMPORT.md'
      - 'source/raw/include/Runtime/RuneSchemaPluginApi.h'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Stage RuneSchema documentation
        shell: bash
        run: |
          rm -f docs/RELEASE-*.md docs/CURRENT-RELEASE.md
          rm -f docs/BASELINE-SUBSYSTEM-AUDIT.md
          rm -f docs/BUILDING-CLONING-FMODEL-AUDIT.md
          rm -f docs/GAMEPASS-SAVE-SYSTEM.md
          rm -f docs/HELpy-REDESIGN-AUDIT.md
          rm -f docs/NATIVE-HOOK-PARITY.md
          rm -f docs/STARTUP-PERFORMANCE.md
          cp source/*.md docs/
          mv docs/README.md docs/OVERVIEW.md
          rm -rf docs/loaders
          cp -R source/loaders docs/loaders
          rm -rf docs/unreal-runeschema
          cp -R source/unreal-runeschema docs/unreal-runeschema
          rm -rf docs/examples docs/schemas
          cp -R source/examples docs/examples
          cp -R source/schemas docs/schemas
          mkdir -p docs/raw/include/Runtime
          cp source/raw/BASE-BUILDER-IMPORT.md docs/raw/BASE-BUILDER-IMPORT.md
          cp source/raw/include/Runtime/RuneSchemaPluginApi.h docs/raw/include/Runtime/RuneSchemaPluginApi.h

      - name: Build documentation
        run: mkdocs build --strict

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

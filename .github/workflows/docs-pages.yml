name: Deploy RuneSchema documentation

on:
  push:
    branches: [main, experimental]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'resources/diagnostics/**'
      - 'build/*diagnostics.py'
      - 'build/prepare-docs.py'
      - 'build/docs-experimental-nav.json'
      - 'build/tests/diagnostics.py'
      - 'build/tests/diagnostic-links.cjs'
      - 'build/tests/documentation.py'
      - 'build/tests/docs-channels.py'
      - 'source/raw/**'
      - 'source/helpy/source/**'
      - 'source/plugins/**'
      - 'source/tools/**'
      - 'source/settings/**'
      - 'plugins/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main documentation
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable

      - name: Checkout experimental feature documentation
        uses: actions/checkout@v6
        with:
          ref: experimental
          path: experimental

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experimental/requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r experimental/requirements-docs.txt

      - name: Audit documentation sources
        working-directory: experimental
        run: |
          python build/generate-diagnostics.py --check
          python build/tests/diagnostics.py
          node build/tests/diagnostic-links.cjs
          python build/tests/documentation.py --self-test
          python build/tests/docs-channels.py
          python build/audit-diagnostics.py

      - name: Assemble stable and experimental areas
        run: |
          python experimental/build/prepare-docs.py --stable stable --experimental experimental --output site-source --stable-sha "$(git -C stable rev-parse HEAD)" --experimental-sha "$(git -C experimental rev-parse HEAD)"

      - name: Build and validate the combined site
        working-directory: site-source
        run: |
          mkdocs build --strict
          python ../experimental/build/audit-diagnostics.py --site site
          python ../experimental/build/tests/documentation.py --site site

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-source/site

      - name: Request public-site rebuild from main
        if: github.ref == 'refs/heads/experimental'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/docs-pages.yml/dispatches"

  deploy:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy RuneSchema documentation

on:
  push:
    branches:
      - main
      - experimental
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'resources/diagnostics/**'
      - 'build/*diagnostics.py'
      - 'build/tests/diagnostics.py'
      - 'build/tests/diagnostic-links.cjs'
      - 'source/raw/**'
      - 'source/helpy/source/**'
      - 'source/plugins/**'
      - 'source/tools/**'
      - 'source/settings/**'
      - 'plugins/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Audit diagnostics and direct links
        run: |
          python build/generate-diagnostics.py --check
          python build/tests/diagnostics.py
          node build/tests/diagnostic-links.cjs
          python build/audit-diagnostics.py

      - name: Build documentation and validate rendered code headers
        run: |
          mkdocs build --strict
          python build/audit-diagnostics.py --site site

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

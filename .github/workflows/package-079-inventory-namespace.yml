name: Package RuneSchema 0.7.9 inventory namespace fix

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/package-079-inventory-namespace.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 9ceece76833d1f9b880747770234b659deea5c3a

      - name: Create source ZIP
        shell: bash
        run: |
          zip -r RuneSchema-0.7.9-inventory-namespace-fix.zip . -x ".git/*"

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-0.7.9-inventory-namespace-fix
          path: RuneSchema-0.7.9-inventory-namespace-fix.zip
          if-no-files-found: error

name: Publish experimental build dependencies

on:
  push:
    branches:
      - experimental
    paths:
      - '.github/workflows/publish-build-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare build dependency package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage
          mkdir -p stage/runtime-template stage/tools/upx

          cp -R clean-base/RuneSchema/. stage/runtime-template/
          rm -f stage/runtime-template/dlls/main.dll
          rm -f stage/runtime-template/plugins/RuneSchema.Helpy/dll/RuneSchema.Helpy.dll

          cp source/tools/upx/upx.exe stage/tools/upx/upx.exe
          cp source/tools/upx/LICENSE stage/tools/upx/LICENSE
          cp source/tools/upx/COPYING stage/tools/upx/COPYING
          cp source/tools/upx/README stage/tools/upx/README

          (
            cd stage
            zip -r ../RuneSchema-BuildDependencies-experimental.zip runtime-template tools
          )

          cp runtime/steam-gog/UE4SS-3.0.1-f6d5f942-Steam-GOG.zip .
          cp runtime/gamepass/UE4SS-3.0.1-f6d5f942-GamePass-WinGDK.zip .

          sha256sum \
            RuneSchema-BuildDependencies-experimental.zip \
            UE4SS-3.0.1-f6d5f942-Steam-GOG.zip \
            UE4SS-3.0.1-f6d5f942-GamePass-WinGDK.zip \
            > SHA256SUMS.txt

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="experimental-build-deps"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              RuneSchema-BuildDependencies-experimental.zip \
              UE4SS-3.0.1-f6d5f942-Steam-GOG.zip \
              UE4SS-3.0.1-f6d5f942-GamePass-WinGDK.zip \
              SHA256SUMS.txt \
              --clobber
          else
            gh release create "$TAG" \
              RuneSchema-BuildDependencies-experimental.zip \
              UE4SS-3.0.1-f6d5f942-Steam-GOG.zip \
              UE4SS-3.0.1-f6d5f942-GamePass-WinGDK.zip \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "RuneSchema Experimental Build Dependencies" \
              --notes "Build-time and storefront dependencies for the RuneSchema experimental branch. These assets are intentionally kept out of normal source downloads." \
              --prerelease
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuneSchema-experimental-build-dependencies
          path: |
            RuneSchema-BuildDependencies-experimental.zip
            SHA256SUMS.txt
